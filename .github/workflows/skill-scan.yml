name: Agent skill scan

# Scans the plugin's agent skills with Cisco AI Defense Skill Scanner using local
# analyzers only: no LLM, VirusTotal, AI Defense API, or other network analyzer,
# and no API keys or secrets. Findings are advisory. Up to 20 Critical and High
# findings are annotated on the PR and every finding is listed in the job summary, but
# findings do not fail the job; it fails only if the scanner cannot scan the
# skills. Patch Tuesday runs the same scan weekly.
on:
  pull_request:
    # develop and main only, like the Security PR Gate: feature PRs into
    # founders-branch are scanned when they promote.
    branches:
      - develop
      - main
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - ".mcp.json"
      - ".github/workflows/skill-scan.yml"
      - ".github/scripts/test_skill_scan.py"

permissions:
  contents: read

jobs:
  skill-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Skill Scanner
        run: |
          python .github/scripts/test_skill_scan.py
          python -m pip install --disable-pip-version-check --quiet "cisco-ai-skill-scanner==2.1.0"

      - name: Scan agent skills
        run: |
          set -euo pipefail
          skill-scanner scan-all skills --recursive --format json --output-json "$RUNNER_TEMP/skill-scan.json" > /dev/null
          python - "$RUNNER_TEMP/skill-scan.json" "$GITHUB_WORKSPACE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text())
          workspace = Path(sys.argv[2]).resolve()
          rank = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3, "INFO": 4}
          results = report.get("results") or []
          # Cisco 2.1.0 can exit successfully with skipped skills, analyzer
          # failures, or metadata-only loader results. Require every input.
          skills = workspace / "skills"
          expected = {manifest.parent.resolve() for manifest in skills.rglob("SKILL.md")}
          scanned = []
          if not expected or not isinstance(results, list):
              sys.exit("Skill Scanner has no complete skill inventory.")
          if (report.get("summary") or {}).get("skills_skipped") or report.get("errors"):
              sys.exit("Skill Scanner skipped one or more skills.")
          for result in results:
              if not isinstance(result, dict) or not isinstance(result.get("skill_path"), str) or not result["skill_path"]:
                  sys.exit("Skill Scanner returned a result without skill provenance.")
              scanned.append(Path(result["skill_path"]).resolve())
              if not result.get("analyzers_used") or result.get("analyzers_failed") or result.get("errors"):
                  sys.exit("Skill Scanner reported an analyzer failure.")
              if not isinstance(result.get("findings"), list):
                  sys.exit("Skill Scanner returned invalid findings.")
              loader = (result.get("scan_metadata") or {}).get("loader") or {}
              if loader.get("content_scanned") is False:
                  sys.exit("Skill Scanner did not scan a skill's content.")
          if len(scanned) != len(set(scanned)) or set(scanned) != expected:
              sys.exit("Skill Scanner results do not cover every expected skill exactly once.")
          # The pinned loader silently omits file contents above this per-file
          # limit, including helpers in otherwise successful skill results.
          if any(item.is_file() and item.stat().st_size > 10 * 1024 * 1024 for item in skills.rglob("*")):
              sys.exit("A skill input exceeds the pinned scanner's 10 MiB per-file limit.")
          findings = []
          for result in results:
              skill_path = Path(result.get("skill_path") or "")
              for finding in result.get("findings") or []:
                  location = skill_path / (finding.get("file_path") or "SKILL.md")
                  try:
                      location = location.resolve().relative_to(workspace)
                  except ValueError:
                      pass
                  findings.append((str(finding.get("severity") or "UNKNOWN").upper(), finding, str(location)))
          findings.sort(key=lambda item: rank.get(item[0], 5))

          def command_data(value):
              return str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def command_property(value):
              return command_data(value).replace(":", "%3A").replace(",", "%2C")

          def markdown_text(value):
              import html
              import re
              text = " ".join(str(value).split())
              text = re.sub(r"[\x00-\x1f\x7f\u202a-\u202e\u2066-\u2069]", "", text)
              return re.sub(r"([\\\x60*_{}\[\]()#+.!|>~-])", r"\\\1", html.escape(text))

          lines = ["## Agent skill scan (advisory)", "", f"Skills scanned: {len(results)}", f"Findings: {len(findings)}", ""]
          annotated = 0
          for severity, finding, location in findings:
              line = finding.get("line_number") or 1
              title = finding.get("title") or finding.get("rule_id") or "finding"
              lines.append("- " + markdown_text(f"[{severity}] {location}:{line} {finding.get('rule_id')}: {title}"))
              # Annotate at most 20 Critical/High findings; the job summary lists all.
              if severity in {"CRITICAL", "HIGH"} and annotated < 20:
                  annotated += 1
                  safe_line = int(line) if str(line).isdigit() and int(line) > 0 else 1
                  annotation_title = command_property(f"Skill Scanner {severity} {finding.get('rule_id')}")
                  message = command_data(f"{title}: {finding.get('description') or ''}")
                  print(f"::warning file={command_property(location)},line={safe_line},title={annotation_title}::{message}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("\n".join(lines) + "\n")
          if not results:
              sys.exit("Skill Scanner returned no scanned skills; the skills were not scanned.")
          PY
